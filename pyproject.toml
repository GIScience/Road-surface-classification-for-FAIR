[project]
name = "road-surface-classifier"
version = "0.1.0"
description = "SUSformer: paved/unpaved road surface classification from aerial imagery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0",
    "geopandas>=1.0",
    "jsonargparse[signatures]>=4.35",
    "lightning>=2.6",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=11.0",
    "pyarrow>=18.0",
    "rasterio>=1.4",
    "shapely>=2.0",
    "tensorboard>=2.18",
    "timm>=1.0.20",
    "torch>=2.6",
    "torchmetrics>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/road_surface_classifier"]

[tool.ruff]
line-length = 120
